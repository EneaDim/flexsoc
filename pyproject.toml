[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexsoc"
version = "0.1.0"
description = "FlexSoC Python package with a thin API layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.7",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7.1",
  "typer>=0.16.0",
  "pytest==8.4.2",
  "pytest-xdist>=3.0.0",
  "ruff>=0.6.0",
  "pyyaml==6.0.2",
  "hjson==3.1.0",
  "jinja2==3.1.6",
  "mako==1.3.10",
  "mistletoe==1.4.0",
  "tabulate==0.9.0",
  "anytree==2.13.0",
  "attrs==25.3.0",
  "packaging==25.0",
  "pyparsing==3.2.3",
  "semantic-version==2.10.0",
  "six==1.17.0",
  "importlib_resources==6.5.2",
  "pycryptodome==3.23.0",
  "markupsafe==3.0.2",
  "systemrdl-compiler==1.30.1",
  "peakrdl-systemrdl==1.0.0",
  "cocotb==2.0.0",
  "ciel>=2.3.1",
  "numpy",
  "scipy",
  "edalize @ git+https://github.com/lowRISC/edalize.git@5ae2c3e1ca306e27d81ce5fcc769f62cb7ac42d0",
  "fusesoc @ git+https://github.com/lowRISC/fusesoc.git@14dfc825ced58fe1fb343662fa80fc4fbd0fdc50",
  "okonomiyaki==3.0.0",
  "simplesat==0.9.2",
]

[project.scripts]
flexsoc = "flexsoc.cli:app"
fx = "flexsoc.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flexsoc = [
  "backend/core/deps.sh",
  "backend/core/toolchain.lock",
  "backend/design/fsm_gen/Makefile",
  "backend/design/fsm_gen/README.md",
  "backend/design/fsm_gen/examples/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "e2e: launches real fx commands and external EDA/toolchain flows",
]
