[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexsoc"
version = "0.1.0"
description = "FlexSoC tool platform (CLI) wrapping deterministic flows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml==6.0.2",
  "hjson==3.1.0",
  "jinja2==3.1.6",
  "mako==1.3.10",
  "mistletoe==1.4.0",
  "tabulate==0.9.0",
  "anytree==2.13.0",
  "attrs==25.3.0",
  "packaging==25.0",
  "pyparsing==3.2.3",
  "semantic-version==2.10.0",
  "six==1.17.0",
  "importlib_resources==6.5.2",
  "pycryptodome==3.23.0",
  "markupsafe==3.0.2",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "systemrdl-compiler==1.30.1",
  "peakrdl-systemrdl==1.0.0",
  "cocotb==2.0.0",
  "numpy",
  "scipy",
]

[project.scripts]
flexsoc = "flexsoc.cli:app"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-xdist>=3.0.0",
  "ruff>=0.6.0",
]

fusesoc = [
  "edalize @ git+https://github.com/lowRISC/edalize.git@5ae2c3e1ca306e27d81ce5fcc769f62cb7ac42d0",
  "fusesoc @ git+https://github.com/lowRISC/fusesoc.git@14dfc825ced58fe1fb343662fa80fc4fbd0fdc50",
  "okonomiyaki==3.0.0",
  "simplesat==0.9.2",
]

all = [
  "flexsoc[dev,fusesoc]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
