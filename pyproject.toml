[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexsoc"
version = "0.1.0"
description = "FlexSoC tool platform (CLI) wrapping deterministic flows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "hjson>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-xdist>=3.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
flexsoc = "flexsoc.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
