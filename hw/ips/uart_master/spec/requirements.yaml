schema: 1
ip: uart_master
baseline: as-built
requirements:
  - id: UM-RST-001
    statement: >-
      Reset shall place the host request interface in an idle state with req_o and we_o
      deasserted and an aligned address.
    scope: common
    origin: derived
    status: baselined
  - id: UM-HOST-001
    statement: >-
      Supported host read commands shall generate a read request on the host master interface.
    scope: common
    origin: derived
    status: baselined
  - id: UM-HOST-002
    statement: >-
      Supported host write commands shall generate a write request with the requested payload
      on the host master interface.
    scope: common
    origin: derived
    status: baselined
  - id: UM-HOST-003
    statement: >-
      Generated host request addresses shall be word aligned.
    scope: common
    origin: derived
    status: baselined
  - id: UM-HOST-004
    statement: >-
      Write byte-enable information shall be propagated according to the supported host
      command.
    scope: common
    origin: derived
    status: baselined
  - id: UM-HOST-005
    statement: >-
      A pending request shall remain asserted with stable address, write/read indication,
      write data and byte enables until grant.
    scope: common
    origin: derived
    status: baselined
  - id: UM-HOST-006
    statement: >-
      A granted request shall be removed on the following sampled cycle.
    scope: common
    origin: derived
    status: baselined
  - id: UM-TX-001
    statement: >-
      The host bridge transmit-enable output shall be asserted after reset according to the
      implemented interface contract.
    scope: common
    origin: derived
    status: baselined
  - id: UM-REG-001
    statement: >-
      The same UART-master CSR semantics shall be accessible through each qualified REG_ITF
      implementation.
    scope: reg_interface
    origin: derived
    status: baselined
