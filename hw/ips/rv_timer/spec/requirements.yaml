schema: 1
ip: rv_timer
baseline: as-built
requirements:
  - id: RVT-RST-001
    statement: >-
      Timer reset shall clear tick_count to its defined zero state.
    scope: common
    origin: derived
    status: baselined
  - id: RVT-TICK-001
    statement: >-
      tick shall assert exactly when the timer is active and tick_count is greater than or
      equal to the programmed prescaler.
    scope: common
    origin: derived
    status: baselined
  - id: RVT-TIME-001
    statement: >-
      The next machine-time datapath value shall equal mtime plus the programmed step.
    scope: common
    origin: derived
    status: baselined
  - id: RVT-INT-001
    statement: >-
      Each timer interrupt shall reflect active state and the comparison mtime >= mtimecmp for
      that timer.
    scope: common
    origin: derived
    status: baselined
  - id: RVT-COUNT-001
    statement: >-
      When inactive or at the programmed terminal prescaler count, tick_count shall return to
      zero; otherwise it shall increment by one per sampled cycle.
    scope: common
    origin: derived
    status: baselined
  - id: RVT-CFG-001
    statement: >-
      Timer control, interrupt and timing configuration shall be software programmable
      according to the CSR contract.
    scope: common
    origin: derived
    status: baselined
  - id: RVT-REG-001
    statement: >-
      The same timer CSR semantics shall be accessible through each qualified REG_ITF
      implementation.
    scope: reg_interface
    origin: derived
    status: baselined
