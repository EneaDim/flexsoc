name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python, lint, and FlexSoC E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONPATH: src
      OSS_CAD_SUITE_URL: https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2025-07-28/oss-cad-suite-linux-x64-20250728.tgz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            make \
            pkg-config \
            python3-dev \
            tcl \
            tk \
            unzip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install OSS CAD Suite
        run: |
          set -euo pipefail
          mkdir -p "$HOME/eda"
          curl -L "$OSS_CAD_SUITE_URL" -o "$RUNNER_TEMP/oss-cad-suite.tgz"
          tar -xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME/eda"
          echo "$HOME/eda/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Sync Python environment
        run: |
          set -euo pipefail
          unset VIRTUAL_ENV || true
          uv sync
          uv run python --version
          uv run python -c "import typer, hjson; print('uv imports OK')"

      - name: Check EDA tools
        run: |
          set -euo pipefail
          command -v verilator
          command -v yosys
          command -v openroad
          command -v opensta || command -v sta
          command -v sv2v || true
          command -v iverilog || true
          verilator --version
          yosys -V
          openroad -version
          if command -v opensta >/dev/null 2>&1; then opensta -version; else sta -version; fi

      - name: Ruff lint
        run: |
          set -euo pipefail
          unset VIRTUAL_ENV || true
          uv run ruff check .

      - name: Unit tests
        run: |
          set -euo pipefail
          unset VIRTUAL_ENV || true
          uv run pytest -s tests/test_api.py

      - name: End-to-end flow
        env:
          FLEXSOC_RUN_E2E: '1'
          FLEXSOC_E2E_SKIP_SIGNOFF: '0'
        run: |
          set -euo pipefail
          unset VIRTUAL_ENV || true
          uv run pytest -s tests/test_e2e_fx.py
