name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FlexSoC tests in locked container
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache project PDK downloads
        uses: actions/cache@v4
        with:
          path: .flexsoc/pdks
          key: flexsoc-pdks-${{ runner.os }}-${{ hashFiles('pdks/**', 'src/flexsoc/pdk.py') }}
          restore-keys: |
            flexsoc-pdks-${{ runner.os }}-

      - name: Run project tests
        env:
          FULL_E2E: "1"
        run: docker/scripts/run-ci.sh
