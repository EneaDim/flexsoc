name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FlexSoC tests in locked container
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true

      - name: Show runner resources
        run: |
          df -h
          free -h
          docker system df

      - name: Resolve locked image
        id: image
        shell: bash
        run: |
          if ! image_ref=$(bash -lc 'source docker/scripts/common.sh; validate_lock'); then
            echo "::error title=Toolchain image refresh required::docker/ci/image.lock does not match the current image inputs. Run the FlexSoC toolchain image workflow with publish=true."
            exit 2
          fi
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "Locked image: $image_ref"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache project PDK downloads
        uses: actions/cache@v4
        with:
          path: .flexsoc/pdks
          key: flexsoc-pdks-${{ runner.os }}-${{ hashFiles('src/flexsoc/backend/core/core.py') }}
          restore-keys: |
            flexsoc-pdks-${{ runner.os }}-

      - name: Run project tests
        env:
          FULL_E2E: "1"
        run: docker/scripts/run-ci.sh "${{ steps.image.outputs.ref }}"
