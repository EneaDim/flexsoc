name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/eneadim/flexsoc:v0.1.0

    env:
      PYTHONPATH: src
      FLEXSOC_EXPECT_VERILATOR: "Verilator 5.043"
      FLEXSOC_EXPECT_SV2V: "sv2v v0.0.13-5-gc1ce7d0"
      FLEXSOC_EXPECT_YOSYS: "Yosys 0.58"
      FLEXSOC_EXPECT_OPENROAD: "v2.0-26328-gd6e98657f1"
      FLEXSOC_EXPECT_OPENSTA: "2.7.0"
      FLEXSOC_EXPECT_IVERILOG: "Icarus Verilog version 12.0"
      FLEXSOC_EXPECT_GTKWAVE: "GTKWave Analyzer v3.3.116"
      FLEXSOC_EXPECT_RISCV_GCC: "15.1.0"

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          python3 --version
          verilator --version
          sv2v --version
          yosys -V
          openroad -version
          sta -version
          iverilog -V | head -n 1
          gtkwave --version
          riscv32-unknown-elf-gcc --version | head -n 1
          netlistsvg --version || true

      - name: Install Python dependencies
        run: |
          python3 -m pip install -U pip setuptools wheel
          python3 -m pip install -r requirements-ci.txt

      - name: Run doctor
        run: |
          python3 -m flexsoc.cli doctor --json

      - name: Run Ruff
        run: |
          python3 -m ruff check .

      - name: Run tests
        run: |
          python3 -m pytest -q
