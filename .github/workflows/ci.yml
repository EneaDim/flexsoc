name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Upgrade packaging tools
        run: |
          python -m pip install -U pip setuptools wheel

      - name: Install package and test dependencies
        run: |
          python -m pip install -r requirements-ci.txt

      - name: Smoke check runtime dependencies
        run: |
          python - <<'PY'
          import flexsoc
          import flexsoc.cli
          import mako
          print("flexsoc import OK")
          print("mako import OK")
          PY
          verilator --version

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q

  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt

      - name: Upgrade packaging tools
        run: |
          python -m pip install -U pip setuptools wheel

      - name: Install package and lint dependencies
        run: |
          python -m pip install -r requirements-ci.txt

      - name: Run Ruff
        run: |
          python -m ruff check .
