name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/eneadim/flexsoc:v0.1.0

    env:
      PYTHONPATH: src
      PATH: /usr/local/OpenROAD/bin:/tools/riscv32/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      FLEXSOC_EXPECT_VERILATOR: "Verilator 5.036"
      FLEXSOC_EXPECT_SV2V: "sv2v v0.0.13-3-g80a2f0c"
      FLEXSOC_EXPECT_YOSYS: "Yosys 0.57+218"
      FLEXSOC_EXPECT_OPENROAD: "v2.0-24945-g9103e99444"
      FLEXSOC_EXPECT_OPENSTA: "2.7.0"
      FLEXSOC_EXPECT_IVERILOG: "Icarus Verilog version 12.0"
      FLEXSOC_EXPECT_GTKWAVE: "GTKWave Analyzer v3.3.116"
      FLEXSOC_EXPECT_RISCV_GCC: "15.2.0"

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail

          python3 --version
          verilator --version
          sv2v --version
          yosys -V

          if command -v openroad >/dev/null 2>&1; then
            openroad -version
          elif [ -x /usr/local/OpenROAD/bin/openroad ]; then
            /usr/local/OpenROAD/bin/openroad -version
          else
            echo "openroad not found"
            exit 127
          fi

          if command -v sta >/dev/null 2>&1; then
            sta -version
          elif [ -x /usr/local/OpenROAD/bin/sta ]; then
            /usr/local/OpenROAD/bin/sta -version
          else
            echo "sta not found"
            exit 127
          fi

          iverilog -V | head -n 1
          gtkwave --version || gtkwave -V || true

          if command -v riscv32-unknown-elf-gcc >/dev/null 2>&1; then
            riscv32-unknown-elf-gcc --version | head -n 1
          elif [ -x /tools/riscv32/bin/riscv32-unknown-elf-gcc ]; then
            /tools/riscv32/bin/riscv32-unknown-elf-gcc --version | head -n 1
          else
            echo "riscv32-unknown-elf-gcc not found"
            exit 127
          fi

          netlistsvg --version || true

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip setuptools wheel

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install -r requirements-ci.txt
          .venv/bin/python -m pip install -r requirements-flow.txt

      - name: Debug doctor implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD SHA: ${GITHUB_SHA}"
          python3 - <<'PY2'
          from pathlib import Path
          p = Path("src/flexsoc/diagnostics/doctor.py")
          print("doctor.py exists:", p.exists())
          text = p.read_text(encoding="utf-8")
          for needle in [
              "sys.stdout.write",
              "expected in full_output",
              '"gtkwave"',
              "not found in PATH or known install locations",
          ]:
              print(f"{needle!r} ->", needle in text)
          PY2
          echo "--- gtkwave probes ---"
          which gtkwave || true
          gtkwave --version || true
          gtkwave -V || true

      - name: Run doctor
        run: |
          .venv/bin/python -m flexsoc.cli doctor --json

      - name: Run Ruff
        run: |
          .venv/bin/python -m ruff check .

      - name: Run tests
        run: |
          .venv/bin/python -m pytest -q
