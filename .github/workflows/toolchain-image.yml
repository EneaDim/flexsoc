name: FlexSoC toolchain image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the verified image to GHCR and emit image.lock
        required: true
        type: boolean
        default: false
      full_e2e:
        description: Run the full E2E suite before publishing
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: flexsoc-toolchain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        env:
          FLEXSOC_JOBS: "2"
        run: docker/scripts/build.sh

      - name: Verify image
        env:
          FULL_E2E: ${{ inputs.full_e2e && '1' || '0' }}
        run: docker/scripts/verify.sh

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: inputs.publish
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker/scripts/publish.sh

      - name: Upload generated image lock
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: flexsoc-ci-image-lock
          path: docker/ci/image.lock
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo '## FlexSoC container image'
            echo
            echo '```text'
            docker/scripts/inspect.sh || true
            echo '```'
            if [[ '${{ inputs.publish }}' == 'true' ]]; then
              echo
              echo 'Download the image-lock artifact and commit docker/ci/image.lock before normal CI runs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
