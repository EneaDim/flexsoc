name: FlexSoC toolchain image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the verified image to GHCR, commit image.lock, and dispatch CI
        required: true
        type: boolean
        default: false
      checkpoint_ref:
        description: Existing toolchain-installed image; leave empty for a full build
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: flexsoc-toolchain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true

      - name: Show runner resources
        run: |
          df -h
          free -h
          docker system df

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.publish || inputs.checkpoint_ref != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          FLEXSOC_JOBS: "2"
          TOOLCHAIN_CHECKPOINT_IMAGE: ${{ inputs.checkpoint_ref }}
        run: docker/scripts/build.sh

      - name: Verify image
        run: docker/scripts/verify.sh

      - name: Publish image
        if: inputs.publish
        run: docker/scripts/publish.sh

      - name: Upload image lock
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: flexsoc-ci-image-lock
          path: docker/ci/image.lock
          if-no-files-found: error

      - name: Commit image lock
        if: inputs.publish && github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)" || {
            echo "Branch moved while the image was building; rerun the workflow." >&2
            exit 2
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/ci/image.lock
          if git diff --cached --quiet; then
            echo "image.lock is already current"
          else
            git commit -m "ci: lock verified toolchain image"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Run CI on locked image
        if: inputs.publish && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$BRANCH"
