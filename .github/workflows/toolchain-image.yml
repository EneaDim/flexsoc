name: FlexSoC toolchain image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when the frozen image is already current
        required: true
        type: boolean
        default: false
      checkpoint_ref:
        description: Existing toolchain-installed image; leave empty for a full build
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: flexsoc-toolchain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check frozen toolchain image
        id: frozen
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
        run: |
          current=false
          image_ref=

          if [[ "$FORCE_REBUILD" != true ]]; then
            if image_ref=$(bash -lc 'source docker/scripts/common.sh; validate_lock' 2>/tmp/flexsoc-lock-error); then
              if docker buildx imagetools inspect "$image_ref" >/dev/null 2>&1; then
                current=true
              else
                echo "Frozen image is missing from GHCR: $image_ref"
              fi
            else
              cat /tmp/flexsoc-lock-error || true
            fi
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

          if [[ "$current" == true ]]; then
            echo "Toolchain image is already frozen and current: $image_ref"
          else
            echo "Toolchain image refresh required."
          fi

      - name: Free runner disk space
        if: steps.frozen.outputs.current != 'true'
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true

      - name: Show runner resources
        if: steps.frozen.outputs.current != 'true'
        run: |
          df -h
          free -h
          docker system df

      - name: Configure registry build cache
        if: steps.frozen.outputs.current != 'true'
        shell: bash
        run: |
          cache_ref=$(bash -lc 'source docker/scripts/common.sh; printf "%s:buildcache\n" "$(registry_repository)"')
          echo "BUILDX_CACHE_REF=$cache_ref" >> "$GITHUB_ENV"
          echo "Build cache: $cache_ref"

      - name: Build toolchain image
        if: steps.frozen.outputs.current != 'true'
        env:
          FLEXSOC_JOBS: "2"
          TOOLCHAIN_CHECKPOINT_IMAGE: ${{ inputs.checkpoint_ref }}
        run: bash docker/scripts/build.sh

      - name: Verify toolchain image
        if: steps.frozen.outputs.current != 'true'
        run: bash docker/scripts/verify.sh

      - name: Publish and freeze toolchain image
        if: steps.frozen.outputs.current != 'true'
        run: bash docker/scripts/publish.sh

      - name: Upload image lock
        if: steps.frozen.outputs.current != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flexsoc-ci-image-lock
          path: docker/ci/image.lock
          if-no-files-found: error

      - name: Commit image lock
        id: lock
        if: steps.frozen.outputs.current != 'true' && github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)" || {
            echo "Branch moved while the image was building; rerun the workflow." >&2
            exit 2
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/ci/image.lock
          if git diff --cached --quiet; then
            echo "image.lock is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ci: lock verified toolchain image"
            git push origin "HEAD:$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch project CI on frozen image
        if: github.ref_type == 'branch' && (steps.frozen.outputs.current == 'true' || steps.lock.outputs.changed != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$BRANCH"
