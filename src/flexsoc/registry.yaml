actions:
  lint:
    description: Run RTL lint
    command:
    - make
    - -C
    - flow
    - lint
    requires_top: false
    requires_run_id: false
    produces_outroot: false
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false

  sim:
    description: Compile and simulate (fast path)
    command:
    - make
    - -C
    - flow
    - sim
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false
      seed:
        type: int
        required: false

  synth:
    description: Run synthesis (Yosys)
    command:
    - make
    - -C
    - flow
    - syn
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false

  sta:
    description: Run static timing analysis
    command:
    - make
    - -C
    - flow
    - sta
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false
      corner:
        type: string
        required: false

  pnr:
    description: Run place and route (OpenROAD)
    command:
    - make
    - -C
    - flow
    - pnr
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false

  ip_start:
    description: Create a new IP template and run full smoke flow (setup+hjson+reg+doc+rtl_stub+tb+lint+compile+sim)
    command:
    - make
    - -C
    - flow
    - ip_start
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: ip_start
    params:
      top:
        type: string
        required: true
      reg_itf:
        type: string
        required: false
      overwrite:
        type: string
        required: false
