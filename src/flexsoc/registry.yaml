actions:
  # ----------------------------
  # Authoring / generation steps
  # ----------------------------

  hjson:
    description: Generate IP HJSON description (register spec / metadata)
    command:
    - make
    - -C
    - flow
    - hjson
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      reg_itf:
        type: string
        required: false
      overwrite:
        type: string
        required: false

  reg:
    description: Generate register RTL + SW artifacts from HJSON (regtool)
    command:
    - make
    - -C
    - flow
    - reg
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      reg_itf:
        type: string
        required: false
      overwrite:
        type: string
        required: false

  doc:
    description: Generate IP documentation from HJSON (regs + overview)
    command:
    - make
    - -C
    - flow
    - doc
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      reg_itf:
        type: string
        required: false

  rtl_stub:
    description: Generate RTL stub/template for the IP
    command:
    - make
    - -C
    - flow
    - rtl_stub
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      overwrite:
        type: string
        required: false

  setup_tb:
    description: Generate setup testbench scaffolding
    command:
    - make
    - -C
    - flow
    - setup_tb
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      overwrite:
        type: string
        required: false

  # ----------------------------
  # Build / verification pipeline
  # ----------------------------

  lint:
    description: Run RTL lint
    command:
    - make
    - -C
    - flow
    - lint
    requires_top: false
    requires_run_id: false
    produces_outroot: false
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false

  sim:
    description: Compile and simulate (fast path)
    command:
    - make
    - -C
    - flow
    - sim
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false
      seed:
        type: int
        required: false

  synth:
    description: Run synthesis (Yosys)
    command:
    - make
    - -C
    - flow
    - syn
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false

  sta:
    description: Run static timing analysis
    command:
    - make
    - -C
    - flow
    - sta
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false
      corner:
        type: string
        required: false

  power:
    description: Run power analysis (OpenSTA)
    command:
    - make
    - -C
    - flow
    - power
    requires_top: true
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: true
      corner:
        type: string
        required: false

  pnr:
    description: Run place and route (OpenROAD)
    command:
    - make
    - -C
    - flow
    - pnr
    requires_top: false
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: false

  pnr_gui:
    description: Open PnR GUI (OpenROAD)
    command:
    - make
    - -C
    - flow
    - pnr_gui
    requires_top: true
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      design:
        type: string
        required: false
      top:
        type: string
        required: true

  # ----------------------------
  # Composite / convenience
  # ----------------------------

  ip_start:
    description: Create a new IP template and run full smoke flow (setup+hjson+reg+doc+rtl_stub+tb+lint+compile+sim)
    command:
    - make
    - -C
    - flow
    - ip_start
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: ip_start
    params:
      top:
        type: string
        required: true
      reg_itf:
        type: string
        required: false
      overwrite:
        type: string
        required: false

  # ----------------------------
  # Integration / export
  # ----------------------------

  driver:
    description: Generate SW driver files (.h/.c) from HJSON/regtool
    command:
    - make
    - -C
    - flow
    - driver
    requires_top: true
    requires_run_id: false
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      reg_itf:
        type: string
        required: false
      overwrite:
        type: string
        required: false

  fsoc_init:
    description: Generate FuseSoC <ip_name>.core under the current workspace run
    command:
    - make
    - -C
    - flow
    - fsoc_init
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      run_id:
        type: string
        required: true
      overwrite:
        type: string
        required: false

  ip_load:
    description: Load an IP bundle into the current run (see flow save/load rules)
    command:
    - make
    - -C
    - flow
    - ip_load
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      run_id:
        type: string
        required: true
      overwrite:
        type: string
        required: false

  ip_save:
    description: Save IP run artifacts to an IP bundle
    command:
    - make
    - -C
    - flow
    - ip_save
    requires_top: true
    requires_run_id: true
    produces_outroot: true
    postprocess: null
    params:
      top:
        type: string
        required: true
      run_id:
        type: string
        required: true
      overwrite:
        type: string
        required: false
